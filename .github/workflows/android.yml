name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  APP_VERSION: "1.01"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web app bundle (models included)
        run: |
          npm ci
          npm run build:app
          npx cap sync android
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PMP_STORE_PASSWORD="${{ secrets.MP_STORE_PASSWORD }}" -PMP_KEY_PASSWORD="${{ secrets.MP_STORE_PASSWORD }}"
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "SFXBM-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SFXBM-apk
          path: SFXBM-*.apk
      - name: Publish as a release (download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${APP_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}" "SFXBM-${APP_VERSION}.apk" --clobber
          else
            gh release create "v${APP_VERSION}" "SFXBM-${APP_VERSION}.apk" \
              --title "SFXBM ${APP_VERSION}" --notes "SFXBM Android APK ${APP_VERSION} - enter any link (MP Tracker, Asset Desk ...). Commit ${{ github.sha }}"
          fi
