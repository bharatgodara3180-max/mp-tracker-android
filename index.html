<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>MP Control Tower</title>
    <style>html,body{background:#0b1020}</style>
    <script>
      // SFXBM app, cold start: open the saved link (or the default LAN link) at once, before the app itself loads.
      // MP-style links need the built-in screens, so those are left to the app. A quick reachability check first, so a dead link never leaves a blank error page.
      (function () {
        try {
          var cap = window.Capacitor;
          if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
          if (sessionStorage.getItem('sfxbm-auto') === '1') return;
          var u = localStorage.getItem('sfxbm-last-url') || (localStorage.getItem('sfxbm-last-link') ? '' : 'http://10.10.39.55:8000/ASSETS/go');
          if (!u) return;
          var x = new URL(u);
          var p = x.pathname.replace(/\/+$/, '');
          var mp = x.port === '8010' || /^\/mp(\/|$)/i.test(p) || (p === '' && x.port === '') || /[?&#]d=/.test(u) && /[?&#]k=/.test(u);
          if (mp) return;
          window.__sfxbmBusy = true;                       // the app shows a splash (not the link box) while this check runs
          var ctl = new AbortController(); var t = setTimeout(function () { ctl.abort(); }, 4000);
          fetch(u, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal }).then(function () {
            clearTimeout(t);
            sessionStorage.setItem('sfxbm-auto', '1');
            window.location.href = u;
          }).catch(function () { clearTimeout(t); window.__sfxbmFailed = true; window.__sfxbmBusy = false; });
        } catch (e) { window.__sfxbmBusy = false; }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="icon-gate-192.png" id="apple-icon" />
    <link rel="manifest" href="manifest-deploy.webmanifest" id="app-manifest" />
    <script>
      // Gate tablet installs "DC IN/OUT", everyone else "MP Deploy"
      (function () {
        var gate = /app=gate/.test(location.search) || /dc-gate|face-kiosk/.test(location.hash);
        document.getElementById('app-manifest').href = gate ? 'manifest-gate.webmanifest' : 'manifest-deploy.webmanifest';
        document.getElementById('apple-icon').href = gate ? 'icon-gate-192.png' : 'icon-deploy-192.png';
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f5a524'/><path d='M8 22V10l8 7 8-7v12' stroke='%230d1117' stroke-width='3' fill='none'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
